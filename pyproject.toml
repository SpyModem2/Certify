[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "certify-server"
version = "0.1.0"
description = "ACME certificate lifecycle management for RHEL"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=43,<47",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "httpx2>=2,<3", "pytest>=8,<9"]

[project.scripts]
certify = "certify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certify = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
