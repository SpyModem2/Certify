name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build application packages
        run: |
          python -m pip install --upgrade pip build
          python -m build
          git archive --format=tar.gz --prefix="certify-${GITHUB_REF_NAME}/" \
            --output="dist/certify-${GITHUB_REF_NAME}-source.tar.gz" HEAD
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS-release)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS-release
